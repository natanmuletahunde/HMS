services:
  api:
    image: ghcr.io/your-org/nexus-hms-api:${IMAGE_TAG:-latest}
    env_file: .env.production
    environment:
      PORT: "8080"
    expose:
      - "8080"
    volumes:
      - uploads_data:/app/uploads
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
  redis:
    image: redis:7-alpine
    env_file: .env.production
    command:
      [
        "sh",
        "-ec",
        'exec redis-server --save "" --appendonly no --requirepass "$$REDIS_PASSWORD"',
      ]
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
  web:
    image: ghcr.io/your-org/nexus-hms-web:${IMAGE_TAG:-latest}
    env_file: .env.production
    environment:
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

# PostgreSQL is external in production. Set DATABASE_URL and SESSION_SECRET in
# .env.production (provisioned by the deployment secret store).

volumes:
  uploads_data: