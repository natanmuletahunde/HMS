kind = "web"
previewPath = "/"
title = "Hotel Management System"
description = "Enterprise Hotel Management System built with Next.js 15 and NestJS. Full-featured operations hub covering reservations, rooms, guests, housekeeping, restaurant, inventory, finance, and HR with role-based access control."
version = "1.0.0"
id = "artifacts/hotel-management"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 18356

[services.development]
run = "pnpm --filter @workspace/hotel-management run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/hotel-management", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/hotel-management", "run", "start"]

[services.production.run.env]
PORT = "18356"
NODE_ENV = "production"

[services.env]
PORT = "18356"
BASE_PATH = "/"
