openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Hotel Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: roles
    description: Role management
  - name: rooms
    description: Room management
  - name: roomTypes
    description: Room type management
  - name: guests
    description: Guest management
  - name: reservations
    description: Reservation management
  - name: housekeeping
    description: Housekeeping management
  - name: maintenance
    description: Maintenance requests
  - name: restaurant
    description: Restaurant orders
  - name: inventory
    description: Inventory management
  - name: invoices
    description: Invoice management
  - name: payments
    description: Payment management
  - name: employees
    description: Employee / HR management
  - name: dashboard
    description: Dashboard statistics
  - name: auditLogs
    description: Audit trail
  - name: notifications
    description: Notifications

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH ──────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Auth tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInput"
      responses:
        "200":
          description: New auth tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ── USERS ─────────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: getUsers
      tags: [users]
      summary: List all users
      parameters:
        - in: query
          name: page
          schema:
            type: number
        - in: query
          name: limit
          schema:
            type: number
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: roleId
          schema:
            type: string
        - in: query
          name: isActive
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUserById
      tags: [users]
      summary: Get user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── ROLES ─────────────────────────────────────────────────────────────────
  /roles:
    get:
      operationId: getRoles
      tags: [roles]
      summary: List all roles
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      operationId: createRole
      tags: [roles]
      summary: Create a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: Created role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"

  /roles/{id}:
    get:
      operationId: getRoleById
      tags: [roles]
      summary: Get role by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
    patch:
      operationId: updateRole
      tags: [roles]
      summary: Update role
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
    delete:
      operationId: deleteRole
      tags: [roles]
      summary: Delete role
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── ROOM TYPES ────────────────────────────────────────────────────────────
  /room-types:
    get:
      operationId: getRoomTypes
      tags: [roomTypes]
      summary: List room types
      responses:
        "200":
          description: Room type list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomType"
    post:
      operationId: createRoomType
      tags: [roomTypes]
      summary: Create room type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomTypeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomType"

  /room-types/{id}:
    get:
      operationId: getRoomTypeById
      tags: [roomTypes]
      summary: Get room type by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Room type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomType"
    patch:
      operationId: updateRoomType
      tags: [roomTypes]
      summary: Update room type
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomTypeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomType"
    delete:
      operationId: deleteRoomType
      tags: [roomTypes]
      summary: Delete room type
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── ROOMS ─────────────────────────────────────────────────────────────────
  /rooms:
    get:
      operationId: getRooms
      tags: [rooms]
      summary: List all rooms
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [available, occupied, reserved, maintenance, cleaning]
        - in: query
          name: floor
          schema:
            type: number
        - in: query
          name: roomTypeId
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: number
        - in: query
          name: limit
          schema:
            type: number
      responses:
        "200":
          description: Paginated room list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomListResponse"
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"

  /rooms/{id}:
    get:
      operationId: getRoomById
      tags: [rooms]
      summary: Get room by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
    patch:
      operationId: updateRoom
      tags: [rooms]
      summary: Update room
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUpdate"
      responses:
        "200":
          description: Updated room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
    delete:
      operationId: deleteRoom
      tags: [rooms]
      summary: Delete room
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /rooms/availability:
    get:
      operationId: getRoomAvailability
      tags: [rooms]
      summary: Get room availability for date range
      parameters:
        - in: query
          name: checkIn
          required: true
          schema:
            type: string
        - in: query
          name: checkOut
          required: true
          schema:
            type: string
        - in: query
          name: roomTypeId
          schema:
            type: string
      responses:
        "200":
          description: Available rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"

  # ── GUESTS ────────────────────────────────────────────────────────────────
  /guests:
    get:
      operationId: getGuests
      tags: [guests]
      summary: List guests
      parameters:
        - in: query
          name: page
          schema:
            type: number
        - in: query
          name: limit
          schema:
            type: number
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Paginated guest list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestListResponse"
    post:
      operationId: createGuest
      tags: [guests]
      summary: Create guest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestInput"
      responses:
        "201":
          description: Created guest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"

  /guests/{id}:
    get:
      operationId: getGuestById
      tags: [guests]
      summary: Get guest by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Guest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
    patch:
      operationId: updateGuest
      tags: [guests]
      summary: Update guest
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestUpdate"
      responses:
        "200":
          description: Updated guest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
    delete:
      operationId: deleteGuest
      tags: [guests]
      summary: Delete guest
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /guests/{id}/reservations:
    get:
      operationId: getGuestReservations
      tags: [guests]
      summary: Get reservation history for a guest
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Guest reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"

  # ── RESERVATIONS ──────────────────────────────────────────────────────────
  /reservations:
    get:
      operationId: getReservations
      tags: [reservations]
      summary: List reservations
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, checked_in, checked_out, cancelled, no_show]
        - in: query
          name: checkIn
          schema:
            type: string
        - in: query
          name: checkOut
          schema:
            type: string
        - in: query
          name: guestId
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: number
        - in: query
          name: limit
          schema:
            type: number
      responses:
        "200":
          description: Paginated reservation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationListResponse"
    post:
      operationId: createReservation
      tags: [reservations]
      summary: Create reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationInput"
      responses:
        "201":
          description: Created reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"

  /reservations/{id}:
    get:
      operationId: getReservationById
      tags: [reservations]
      summary: Get reservation by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
    patch:
      operationId: updateReservation
      tags: [reservations]
      summary: Update reservation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationUpdate"
      responses:
        "200":
          description: Updated reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
    delete:
      operationId: deleteReservation
      tags: [reservations]
      summary: Delete / cancel reservation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /reservations/{id}/check-in:
    post:
      operationId: checkIn
      tags: [reservations]
      summary: Check in a guest
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Check-in result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"

  /reservations/{id}/check-out:
    post:
      operationId: checkOut
      tags: [reservations]
      summary: Check out a guest
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Check-out result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"

  /reservations/today-arrivals:
    get:
      operationId: getTodayArrivals
      tags: [reservations]
      summary: Today's expected arrivals
      responses:
        "200":
          description: Arrivals list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"

  /reservations/today-departures:
    get:
      operationId: getTodayDepartures
      tags: [reservations]
      summary: Today's expected departures
      responses:
        "200":
          description: Departures list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"

  # ── HOUSEKEEPING ──────────────────────────────────────────────────────────
  /housekeeping:
    get:
      operationId: getHousekeepingAssignments
      tags: [housekeeping]
      summary: List housekeeping assignments
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, in_progress, completed, inspected]
        - in: query
          name: date
          schema:
            type: string
        - in: query
          name: staffId
          schema:
            type: string
      responses:
        "200":
          description: Assignment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HousekeepingAssignment"
    post:
      operationId: createHousekeepingAssignment
      tags: [housekeeping]
      summary: Create housekeeping assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HousekeepingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousekeepingAssignment"

  /housekeeping/{id}:
    get:
      operationId: getHousekeepingById
      tags: [housekeeping]
      summary: Get housekeeping assignment by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousekeepingAssignment"
    patch:
      operationId: updateHousekeeping
      tags: [housekeeping]
      summary: Update housekeeping assignment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HousekeepingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousekeepingAssignment"

  /housekeeping/summary:
    get:
      operationId: getHousekeepingSummary
      tags: [housekeeping]
      summary: Housekeeping summary stats
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousekeepingSummary"

  # ── MAINTENANCE ───────────────────────────────────────────────────────────
  /maintenance:
    get:
      operationId: getMaintenanceRequests
      tags: [maintenance]
      summary: List maintenance requests
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [open, in_progress, resolved, closed]
        - in: query
          name: priority
          schema:
            type: string
            enum: [low, medium, high, urgent]
        - in: query
          name: roomId
          schema:
            type: string
      responses:
        "200":
          description: Maintenance request list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceRequest"
    post:
      operationId: createMaintenanceRequest
      tags: [maintenance]
      summary: Create maintenance request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceRequest"

  /maintenance/{id}:
    get:
      operationId: getMaintenanceById
      tags: [maintenance]
      summary: Get maintenance request by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceRequest"
    patch:
      operationId: updateMaintenance
      tags: [maintenance]
      summary: Update maintenance request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceRequest"

  # ── RESTAURANT ────────────────────────────────────────────────────────────
  /restaurant/orders:
    get:
      operationId: getRestaurantOrders
      tags: [restaurant]
      summary: List restaurant orders
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, preparing, ready, served, cancelled]
        - in: query
          name: tableNumber
          schema:
            type: number
        - in: query
          name: date
          schema:
            type: string
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RestaurantOrder"
    post:
      operationId: createRestaurantOrder
      tags: [restaurant]
      summary: Create restaurant order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestaurantOrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantOrder"

  /restaurant/orders/{id}:
    get:
      operationId: getRestaurantOrderById
      tags: [restaurant]
      summary: Get restaurant order by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantOrder"
    patch:
      operationId: updateRestaurantOrder
      tags: [restaurant]
      summary: Update restaurant order
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestaurantOrderUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantOrder"

  /restaurant/menu-items:
    get:
