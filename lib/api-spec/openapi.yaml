components:
  schemas:
    # ── SHARED ────────────────────────────────────────────────────────────────
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    PaginationMeta:
      type: object
      properties:
        total:
          type: number
        page:
          type: number
        limit:
          type: number
        totalPages:
          type: number
      required: [total, page, limit, totalPages]

    # ── AUTH ──────────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 6

    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/User"

    # ── USER ──────────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, email, firstName, lastName, roleId, isActive, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        roleId:
          type: string
        roleName:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    UserListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    UserInput:
      type: object
      required: [email, password, firstName, lastName, roleId]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 6
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        roleId:
          type: string

    UserUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        roleId:
          type: string
        isActive:
          type: boolean

    # ── ROLE ──────────────────────────────────────────────────────────────────
    Role:
      type: object
      required: [id, name, description, isActive, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        permissions:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        createdAt:
          type: string

    RoleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string

    RoleUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        isActive:
          type: boolean

    # ── ROOM TYPE ─────────────────────────────────────────────────────────────
    RoomType:
      type: object
      required: [id, name, basePrice, maxOccupancy, isActive, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        basePrice:
          type: number
        maxOccupancy:
          type: number
        amenities:
          type: array
          items:
            type: string
        imageUrl:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    RoomTypeInput:
      type: object
      required: [name, basePrice, maxOccupancy]
      properties:
        name:
          type: string
        description:
          type: string
        basePrice:
          type: number
        maxOccupancy:
          type: number
        amenities:
          type: array
          items:
            type: string
        imageUrl:
          type: string

    RoomTypeUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        basePrice:
          type: number
        maxOccupancy:
          type: number
        amenities:
          type: array
          items:
            type: string
        imageUrl:
          type: string
        isActive:
          type: boolean

    # ── ROOM ──────────────────────────────────────────────────────────────────
    Room:
      type: object
      required: [id, number, floor, status, roomTypeId, isActive, createdAt]
      properties:
        id:
          type: string
        number:
          type: string
        floor:
          type: number
        status:
          type: string
          enum: [available, occupied, reserved, maintenance, cleaning]
        roomTypeId:
          type: string
        roomTypeName:
          type: ["string", "null"]
        basePrice:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    RoomListResponse:
