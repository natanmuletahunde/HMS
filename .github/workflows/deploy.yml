name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/nexus-hms-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/nexus-hms-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/api-server run test:security
      - name: Build and smoke-test API image
        run: |
          docker build -f Dockerfile.api \
            -t "${API_IMAGE}:${GITHUB_SHA}" \
            -t "${API_IMAGE}:latest" .
          sh tools/smoke-api-container.sh "${API_IMAGE}:${GITHUB_SHA}"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push API images
        run: |
          docker push "${API_IMAGE}:${GITHUB_SHA}"
          docker push "${API_IMAGE}:latest"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          build-args: |
            NEXT_PUBLIC_API_URL=
            API_INTERNAL_URL=http://api:8080
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Deploy immutable images
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_DATA" | base64 --decode > "$HOME/.kube/config"
          # Secrets are provisioned out-of-band; do not replace them with the
          # placeholder manifest committed to this repository.
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml -f k8s/pvc.yaml -f k8s/network-policies.yaml
          kubectl apply -f k8s/api-service.yaml -f k8s/web-service.yaml -f k8s/redis-service.yaml
          kubectl apply -f k8s/redis-deployment.yaml
          kubectl -n nexus-hms rollout status deployment/redis --timeout=3m
          sed "s#ghcr.io/your-org/nexus-hms-api:latest#${API_IMAGE}:${GITHUB_SHA}#" \
            k8s/api-deployment.yaml | kubectl apply -f -
          sed "s#ghcr.io/your-org/nexus-hms-web:latest#${WEB_IMAGE}:${GITHUB_SHA}#" \
            k8s/web-deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/hpa-api.yaml -f k8s/hpa-web.yaml -f k8s/ingress.yaml
          if ! kubectl -n nexus-hms rollout status deployment/api --timeout=5m || \
             ! kubectl -n nexus-hms rollout status deployment/web --timeout=5m; then
            kubectl -n nexus-hms rollout undo deployment/api || true
            kubectl -n nexus-hms rollout undo deployment/web || true
            kubectl -n nexus-hms rollout status deployment/api --timeout=5m || true
            kubectl -n nexus-hms rollout status deployment/web --timeout=5m || true
            exit 1
          fi