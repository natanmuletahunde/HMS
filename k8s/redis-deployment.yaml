apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: nexus-hms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-hms-redis
  template:
    metadata:
      labels:
        app: nexus-hms-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              printf 'save ""\nappendonly no\nrequirepass %s\n' "$REDIS_PASSWORD" > /tmp/redis.conf
              exec redis-server /tmp/redis.conf
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexus-hms-secrets
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -qx PONG
            initialDelaySeconds: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -qx PONG
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: redis-tmp
              mountPath: /tmp
      volumes:
        - name: redis-tmp
          emptyDir: {}